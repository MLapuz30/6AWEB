<div class="home-container">
  <div class="profile-card">
    <h1>{{ name }}</h1>
    <h3>{{ title }}</h3>

    <p class="bio">{{ bio }}</p>

    <div class="info-section">
      <p><strong>Email:</strong> {{ email }}</p>
      <p><strong>Phone:</strong> {{ phone }}</p>
      <p><strong>Location:</strong> {{ location }}</p>
    </div>

    <h3>Skills</h3>
    <ul>
      <li>Angular</li>
      <li>HTML and CSS</li>
      <li>JavaScript</li>

    </ul>
  </div>
</div>
