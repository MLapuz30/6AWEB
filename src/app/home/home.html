<div class="text-center">
        <h1 class="mt-10 mb-10 text-5xl font-semibold text-balance text-gray-900 sm:text-5xl">Join our Research Conferences around the Globe!</h1>

<div class = "flex flex-row space-x-10 justify-center">
  @for (item of countries; track $index) {
<div class="bg-neutral-primary-soft block max-w-sm p-6 border border-default rounded-base shadow-xs my-10">
    <a href="#">
        <img class="rounded-base" [src]="item.img" alt="" style="width: 400px; height: 200px;" />
    </a>
    <a href="#">
        <h5 class="mt-6 mb-2 text-2xl font-semibold tracking-tight text-heading">{{item.name}}.</h5>
    </a>
    <p class="mb-6 text-body"> {{item.desc}} </p>
    <a href="#" class="inline-flex items-center text-body bg-neutral-secondary-medium box-border border border-default-medium hover:bg-neutral-tertiary-medium hover:text-heading focus:ring-4 focus:ring-neutral-tertiary shadow-xs font-medium leading-5 rounded-base text-sm px-4 py-2.5 focus:outline-none">
        {{item.topic}}
    </a>
</div>
  }
</div>
</div>
