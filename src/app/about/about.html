<div class="bg-white/40">
  <div class="relative isolate px-6 pt-14 lg:px-8">
    <div aria-hidden="true" class="absolute inset-x-0 -top-40 -z-10 transform-gpu overflow-hidden blur-3xl sm:-top-80">
      <div style="clip-path: polygon(74.1% 44.1%, 100% 61.6%, 97.5% 26.9%, 85.5% 0.1%, 80.7% 2%, 72.5% 32.5%, 60.2% 62.4%, 52.4% 68.1%, 47.5% 58.3%, 45.2% 34.5%, 27.5% 76.7%, 0.1% 64.9%, 17.9% 100%, 27.6% 76.8%, 76.1% 97.7%, 74.1% 44.1%)" class="relative left-[calc(50%-11rem)] aspect-1155/678 w-144.5 -translate-x-1/2 rotate-30 bg-linear-to-tr from-[#ff80b5] to-[#9089fc] opacity-30 sm:left-[calc(50%-30rem)] sm:w-288.75"></div>
    </div>
    <div class="mx-auto max-w-6xl py-32 sm:py-48 lg:py-56">
      <div class="hidden sm:mb-8 sm:flex sm:justify-center">
      </div>
      <div class="text-center">
        <h1 class="text-5xl font-semibold text-balance text-gray-900 sm:text-5xl">About the Organization</h1>
        <p class="mt-8 text-lg font-medium text-pretty text-gray-900 sm:text-2xl">Learn how the team and committee leadership are shaping th world of conferences, get the latest conference news and updates on our blog, and contact us for guidance</p>
        <button class="mt-8 inline-flex items-center rounded-base px-4 py-2.5
         border-2 border-black
         bg-white text-black
         text-sm font-medium leading-5
         hover:bg-black hover:text-white
         focus:outline-none focus:ring-4 focus:ring-black/30
         shadow-xs">Learn More</button>
      </div>
    </div>
  </div>
</div>
</div>

<div class="event-section mx-80 my-20">
  <h1 class="text-3xl font-bold text-grey">{{ event.title }}</h1>
  <p class="text-lg text-grey mt-4">{{ event.description }}</p>
  <a [href]="event.actionLink" class="inline-flex items-center bg-blue-600 text-white px-4 py-2 mt-6 rounded-md hover:bg-blue-700">
    {{ event.actionText }}
  </a>
  <p class="text-base text-grey mt-8">{{ event.subtitle }}</p>
</div>
