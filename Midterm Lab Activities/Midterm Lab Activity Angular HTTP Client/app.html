<h2>Users</h2>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Username</th>
      <th>Email</th>
    </tr>
  </thead>

  <tbody>
    @for (user of httpusers; track user.id) {
      <tr class="border-b">
        <td class="py-2 px-4 text-center">{{ user.id }}</td>
        <td class="py-2 px-4 text-center">{{ user.name }}</td>
        <td class="py-2 px-4 text-center">{{ user.username }}</td>
        <td class="py-2 px-4 text-center">{{ user.email }}</td>
      </tr>
    }
  </tbody>
</table>

<h2>Posts</h2>

<table>
  <thead>
    <tr>
      <th>User ID</th>
      <th>id</th>
      <th>Title</th>
      <th>Body</th>
    </tr>
  </thead>

  <tbody>
    @for (post of httpposts; track post.id) {
      <tr class="border-b">
        <td class="py-2 px-4 text-center">{{ post.userId }}</td>
        <td class="py-2 px-4 text-center">{{ post.id }}</td>
        <td class="py-2 px-4 text-center">{{ post.title }}</td>
        <td class="py-2 px-4 text-center">{{ post.body }}</td>
      </tr>
    }
  </tbody>
</table>

<router-outlet></router-outlet>
